name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'react-portfolio/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: react-portfolio/package-lock.json

      - name: Install and build
        working-directory: react-portfolio
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Copy build to site root
        run: |
          rm -rf static
          cp -r react-portfolio/build/static ./static
          cp react-portfolio/build/index.html .
          cp react-portfolio/build/asset-manifest.json .
          cp react-portfolio/build/favicon.ico .
          cp react-portfolio/build/logo192.png .
          cp react-portfolio/build/logo512.png .
          cp react-portfolio/build/manifest.json .
          cp react-portfolio/build/robots.txt .

      - name: Commit and push site artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static index.html asset-manifest.json favicon.ico logo192.png logo512.png manifest.json robots.txt
          git diff --staged --quiet || git commit -m "Deploy site from react-portfolio build"
          git push
